name: Monorepo checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run emails:preview
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_MODE: demo
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook-static
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: email-previews
          path: packages/emails/.preview
          include-hidden-files: true
          retention-days: 7

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: meo_ci
          POSTGRES_PASSWORD: integration-local-only
          POSTGRES_DB: meo_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U meo_ci -d meo_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run backend:build
      - run: npm run backend:test
        env:
          DATABASE_URL: postgresql://meo_ci:integration-local-only@127.0.0.1:5432/meo_ci
          REDIS_URL: redis://127.0.0.1:6379/0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-logs
          path: var/backend-tests/*/*.log
          retention-days: 3

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.backend -t meo-backend:ci .
