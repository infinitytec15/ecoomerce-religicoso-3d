name: meo-backend
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: meo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use scripts/backend-local.mjs setup}
      POSTGRES_DB: meo
    ports: ['127.0.0.1:5545:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meo -d meo']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.3-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
        '--requirepass',
        '${REDIS_PASSWORD:?Use scripts/backend-local.mjs setup}',
      ]
    ports: ['127.0.0.1:6385:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
volumes:
  postgres-data:
  redis-data:
