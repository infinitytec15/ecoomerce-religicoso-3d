<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo · Mãos em Oração</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/faith-fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#3e4934;font-family:'DM Sans',sans-serif}main{max-width:1280px;margin:auto;padding:55px 60px}h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:54px;line-height:1;letter-spacing:-.025em;margin:0}header p{font-size:13px;color:#65695f;margin:14px 0 38px}.logos{display:grid;grid-template-columns:1fr 1fr;border:1px solid #dedfd6;border-radius:14px;overflow:hidden}.logos>section{min-height:315px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:35px}.logos>section:nth-child(2){background:#3e4934;color:#fff7e9}.logos img{width:min(100%,400px);height:auto;display:block}.logos span{font-size:11px;margin-top:20px}.palette{display:flex;gap:40px;align-items:center;margin-top:35px}.palette>div{display:flex;gap:12px;align-items:center;font-size:12px}.palette i{width:30px;height:30px;border:1px solid #dedfd6;border-radius:50%}.palette small{display:block;font-size:10px;color:#65695f;margin-top:4px}footer{font-size:11px;color:#65695f;margin-top:40px;line-height:1.8;max-width:70ch}@media(max-width:700px){main{padding:32px 22px}h1{font-size:42px}.logos{grid-template-columns:1fr}.logos>section{min-height:220px;padding:25px}.palette{gap:20px;flex-wrap:wrap}}</style></head><body><main><header><h1>Mãos em Oração</h1><p>Assinatura da marca · Essência</p></header><div class="logos"><section><img src="assets/maos-em-oracao-logo.svg" alt="Logo Mãos em Oração na cor verde oliva"><span>Para fundos claros</span></section><section><img src="assets/maos-em-oracao-logo-clara.svg" alt="Logo Mãos em Oração na cor creme"><span>Para fundos escuros</span></section></div><div class="palette"><div><i style="background:#3e4934"></i><span>Oliva<small>#3E4934</small></span></div><div><i style="background:#faf9f5"></i><span>Creme<small>#FAF9F5</small></span></div><div><i style="background:#aa5438"></i><span>Terracota<small>#AA5438</small></span></div></div><footer>Mãos unidas em oração, acolhidas por um arco. Uma assinatura que acompanha a fé no lar e o cuidado presente em cada peça.</footer></main></body></html>
